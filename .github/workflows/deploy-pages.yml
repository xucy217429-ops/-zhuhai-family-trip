name: Deploy optimized static site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - assets/source/**
      - scripts/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Generate responsive WebP images
        run: python scripts/optimize_images.py
      - name: Assemble site
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp index.html public/404.html
          touch public/.nojekyll
          test -f public/index.html
          test -f public/404.html
          echo 'Verified entry and fallback files'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
